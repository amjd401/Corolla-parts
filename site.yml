name: 9-hour dealer check
on:
  schedule:
    # Wakes up every hour; the check only runs when the last one is 9 hours old.
    # GitHub sometimes skips scheduled runs, so the next hour catches up.
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: corolla-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Is a check due?
        id: due
        run: |
          python3 - <<'PY'
          import json, os, time
          from datetime import datetime
          event = os.environ['GITHUB_EVENT_NAME']
          items = json.load(open('data.json'))['items'].values()
          times = [datetime.fromisoformat(i['lastAttemptAt'].replace('Z', '+00:00')).timestamp() for i in items if i.get('lastAttemptAt')]
          age = (time.time() - max(times)) / 3600 if times else 99
          due = event == 'workflow_dispatch' or (event == 'schedule' and age >= 8.6)
          print(f'Last check {age:.1f} hours ago. Check now: {due}')
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f"due={'true' if due else 'false'}\n")
          PY
      - name: Check all dealer parts and offers
        if: steps.due.outputs.due == 'true'
        run: python3 refresh.py
      - name: Save results in repository
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update dealer availability and offers'
            git push origin HEAD:main
          fi
      - name: Report part numbers the dealer did not confirm
        if: steps.due.outputs.due == 'true'
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('refresh-report.json'))['notRenewed']))")
          if [ "$n" != "0" ]; then
            echo "$n part numbers were not confirmed by the dealer. See the summary above."
            exit 1
          fi
