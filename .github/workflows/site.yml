name: Website and 6-hour dealer check
on:
  push:
    branches: [main]
  schedule:
    # Wakes up every hour; the check only runs when the last one is 6 hours old.
    # GitHub sometimes skips scheduled runs, so the next hour catches up.
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: corolla-pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      due: ${{ steps.due.outputs.due }}
      not_renewed: ${{ steps.report.outputs.not_renewed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Is a check due?
        id: due
        run: |
          python3 - <<'PY'
          import json, os, time
          from datetime import datetime
          event = os.environ['GITHUB_EVENT_NAME']
          items = json.load(open('data.json'))['items'].values()
          times = [datetime.fromisoformat(i['lastAttemptAt'].replace('Z', '+00:00')).timestamp() for i in items if i.get('lastAttemptAt')]
          age = (time.time() - max(times)) / 3600 if times else 99
          due = event == 'workflow_dispatch' or (event == 'schedule' and age >= 5.6)
          print(f'Last check {age:.1f} hours ago. Check now: {due}')
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f"due={'true' if due else 'false'}\n")
          PY
      - name: Check all dealer parts and offers
        if: steps.due.outputs.due == 'true'
        run: python3 refresh.py
      - name: Save results in repository
        if: steps.due.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update dealer availability and offers'
            git push origin HEAD:main
          fi
      - name: Count part numbers the dealer did not confirm
        id: report
        if: steps.due.outputs.due == 'true'
        run: python3 -c "import json,os; r=json.load(open('refresh-report.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('not_renewed=%d\n' % len(r['notRenewed']))"
  publish:
    needs: check
    if: github.event_name == 'push' || needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html catalog.json data.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report part numbers the dealer did not confirm
        if: needs.check.outputs.not_renewed != '' && needs.check.outputs.not_renewed != '0'
        run: |
          echo "${{ needs.check.outputs.not_renewed }} part numbers were not confirmed by the dealer. See the check job summary."
          exit 1
