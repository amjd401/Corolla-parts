name: Website and 6-hour dealer check
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: corolla-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check all dealer parts and offers
        if: github.event_name != 'push'
        run: python3 refresh.py
      - name: Save results in repository
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update dealer availability and offers'
            git push origin HEAD:main
          fi
      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html catalog.json data.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report part numbers the dealer did not confirm
        if: github.event_name != 'push'
        run: python3 -c "import json,sys; r=json.load(open('refresh-report.json')); sys.exit(1 if r['notRenewed'] else 0)"
